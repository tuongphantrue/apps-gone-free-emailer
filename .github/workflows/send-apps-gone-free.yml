name: Send iOS Apps Gone Free Email

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes - set intentionally, leave as-is
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push the dedup-state branch (see "Persist" step below)

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Same "dedup-via-state-branch" trick as tech-price-mailer / gold-price-emailer:
      # the "already notified about this app" file lives on its own branch (apps-state),
      # checked out into a worktree alongside main so main's own files are never touched.
      # First-ever run: the branch doesn't exist yet, so an empty orphan one is created locally.
      - name: Restore dedup state from state branch
        run: |
          if git ls-remote --exit-code --heads origin apps-state >/dev/null 2>&1; then
            git fetch origin apps-state:apps-state
            git worktree add state-wt apps-state
          else
            echo "No apps-state branch yet - starting fresh."
            git worktree add --orphan -B apps-state state-wt
            find state-wt -mindepth 1 -not -path 'state-wt/.git*' -delete
          fi
          mkdir -p state-wt/state

      - name: Generate email
        env:
          STATE_FILE: state-wt/state/notified.json
          CHART_STATE_FILE: state-wt/state/chart_candidates.json
          ICON_ASSETS_DIR: icon-assets
          ICON_ASSETS_BRANCH: icon-assets
          COUNTRY: "us"
          COOLDOWN_DAYS: "21"
          CHART_LIMIT: "100"
        run: python apps_gone_free_emailer.py generate

      # Only exists if a source parsed to 0 apps this run (see fetch_all_sources()
      # in apps_gone_free_emailer.py) - upload-artifact no-ops via if-no-files-found
      # when debug/ wasn't created, so this is a no-op on a normal successful run.
      - name: Upload debug HTML (only if a source returned 0 apps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug/
          if-no-files-found: ignore
          retention-days: 14

      # Same pattern as 9gag-meme-emailer's meme-assets branch: icons downloaded
      # during "Generate email" (see rehost_icons() in apps_gone_free_emailer.py)
      # get published here via the same worktree trick as the state branch above,
      # except icons ACCUMULATE across runs rather than being overwritten each
      # time - old emails still need their images to resolve later. A no-op
      # (nothing to publish) whenever nothing new went out this run.
      - name: Publish images to the icon-assets branch
        run: |
          if [ -d icon-assets ] && [ "$(ls -A icon-assets 2>/dev/null)" ]; then
            if git ls-remote --exit-code --heads origin icon-assets >/dev/null 2>&1; then
              git fetch origin icon-assets:icon-assets
              git worktree add icon-wt icon-assets
            else
              git worktree add --orphan -B icon-assets icon-wt
              find icon-wt -mindepth 1 -not -path 'icon-wt/.git*' -delete
            fi
            cp icon-assets/* icon-wt/
            cd icon-wt
            git add -A
            if git diff --cached --quiet; then
              echo "No new icons to publish this run."
            else
              git commit -q -m "Add app icons [skip ci]"
              git push -q origin icon-assets
            fi
            cd ..
            git worktree remove icon-wt --force
          else
            echo "No icons downloaded this run (nothing new, or every rehost attempt failed) - skipping publish."
          fi

      - name: Wait for raw.githubusercontent.com to serve the new files
        run: |
          if [ -d icon-assets ] && [ "$(ls -A icon-assets 2>/dev/null)" ]; then
            echo "Waiting 30s for raw.githubusercontent.com to catch up..."
            sleep 30
          else
            echo "No new icons published - skipping wait."
          fi

      - name: Send email
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APPS_RECIPIENT: ${{ secrets.APPS_RECIPIENT }}
        run: python apps_gone_free_emailer.py send

      - name: Persist dedup state to state branch
        run: |
          cd state-wt
          git add -A
          if git diff --cached --quiet; then
            echo "No state changes to persist this run."
          else
            git commit -q -m "Update notified-apps state [skip ci]"
            git push -q origin apps-state
          fi
          cd ..
          git worktree remove state-wt --force
